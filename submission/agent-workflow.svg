<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Observation-driven incident investigation workflow</title><desc id="desc">Image quality, OpenCV change regions, sensor correlation and older visual history choose later agent tools, stop states and human review.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#827b8c"/></marker><style>.box{fill:#fff;stroke:#dcd7e3;stroke-width:1.5;rx:11}.gate{fill:#f7f3ff;stroke:#a88bd9;stroke-width:1.7}.stop{fill:#fff8ed;stroke:#e6c991;stroke-width:1.5;rx:11}.good{fill:#f1f8f3;stroke:#a7ceb3;stroke-width:1.5;rx:11}.h{font:600 15px Arial;fill:#241e2b}.t{font:12px Arial;fill:#59535f}.s{font:11px Arial;fill:#7b7580}.a{stroke:#887f92;stroke-width:1.7;fill:none;marker-end:url(#a)}.lbl{font:700 10px Arial;letter-spacing:1px;fill:#786d88}</style></defs>
<rect width="1000" height="720" fill="#faf9fc"/><text x="40" y="42" class="lbl">FORTIFIERS INCIDENT MEMORY · BOUNDED PERCEPTION / DECISION / ACTION</text>
<rect x="330" y="74" width="340" height="64" class="box"/><text x="355" y="102" class="h">1 · Retrieve event + camera history</text><text x="355" y="123" class="s">timestamped frames · sensor payload · evidence IDs</text>
<path class="a" d="M500 138 V162"/><rect x="330" y="164" width="340" height="70" class="box"/><text x="355" y="193" class="h">2 · OpenCV image quality</text><text x="355" y="215" class="s">blur · exposure · resolution · comparability</text>
<path class="a" d="M500 234 V258"/><polygon points="500,260 638,312 500,364 362,312" class="gate"/><text x="438" y="307" class="h">Usable frame?</text><text x="430" y="328" class="s">quality evidence gates compare</text>
<path class="a" d="M362 312 H176 V382"/><text x="195" y="302" class="lbl">NO</text><rect x="42" y="385" width="270" height="91" class="stop"/><text x="64" y="414" class="h">Seek another frame</text><text x="64" y="438" class="t">Unavailable / still poor → retake request</text><text x="64" y="458" class="s">stop: insufficient evidence · no diagnosis</text>
<path class="a" d="M638 312 H812 V382"/><text x="767" y="302" class="lbl">YES</text><rect x="685" y="385" width="270" height="91" class="box"/><text x="707" y="414" class="h">3 · Select pre-event baseline</text><text x="707" y="438" class="t">same camera/context · newest usable frame</text><text x="707" y="458" class="s">exclude incident-contaminated frames</text>
<path class="a" d="M820 476 V499 H635"/><rect x="365" y="500" width="400" height="82" class="box"/><text x="390" y="530" class="h">4 · OpenCV ORB/RANSAC + normalized change mask</text><text x="390" y="554" class="t">registration · HSV normalization · connected regions</text><text x="390" y="574" class="s">no region → correlate sensor / report no visual support</text>
<path class="a" d="M365 541 H192 V603"/><text x="200" y="530" class="lbl">REGION FOUND</text><rect x="42" y="606" width="280" height="86" class="box"/><text x="64" y="633" class="h">5 · Inspect candidate region</text><text x="64" y="655" class="t">retrieve older frame → compare region with OpenCV</text><text x="64" y="675" class="s">similar prior appearance → downgrade novelty</text>
<path class="a" d="M765 541 H846 V603"/><rect x="700" y="606" width="255" height="86" class="good"/><text x="722" y="633" class="h">Sensor/time evidence</text><text x="722" y="655" class="t">active + within 5 minutes?</text><text x="722" y="675" class="s">candidate + aligned sensor → human review</text>
<path class="a" d="M322 649 H405 V598"/><path class="a" d="M700 649 H660 V589"/><text x="40" y="708" class="s">All branches end in a hashed evidence report. Maximum 10 tool calls. No actuator, alarm, door or dispatch tools exist.</text>
</svg>
