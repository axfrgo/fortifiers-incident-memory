<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
<title id="title">Fortifiers Incident Memory system architecture</title><desc id="desc">OpenCV 5 vision and agent pipeline deployed on AWS Lambda from a ZIP package with a public synthetic Function URL, private S3, and CloudWatch.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#80768d"/></marker><style>.bg{fill:#faf9fc}.box{fill:#fff;stroke:#d8d3df;stroke-width:1.5;rx:12}.local{stroke:#7152c7;stroke-width:2}.planned{stroke:#b99fe9;stroke-width:2;stroke-dasharray:7 5}.head{font:600 17px Arial;fill:#211c29}.txt{font:13px Arial;fill:#514b58}.sub{font:11px Arial;fill:#77717d}.label{font:700 11px Arial;letter-spacing:1.2px;fill:#766d83}.arrow{stroke:#8d8498;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.panel{fill:#fff;stroke:#ddd8e4;stroke-width:1.4;rx:18}</style></defs>
<rect class="bg" width="1180" height="760"/>
<text x="50" y="42" class="label">FORTIFIERS INCIDENT MEMORY · SYSTEM ARCHITECTURE</text><text x="50" y="70" class="head" font-size="24">Event evidence → OpenCV 5 → observation-driven investigation</text>
<rect x="40" y="106" width="1090" height="420" class="panel"/><text x="66" y="136" class="label">LOCAL APPLICATION + VERIFIED REMOTE AWS RUNTIME</text>
<rect x="66" y="172" width="210" height="115" class="box"/><text x="86" y="201" class="head">Synthetic event &amp; frames</text><text x="86" y="226" class="txt">baseline · alarm image</text><text x="86" y="248" class="txt">water-contact event</text><text x="86" y="270" class="sub">7 procedural test cases</text>
<rect x="320" y="172" width="210" height="115" class="box"/><text x="340" y="201" class="head">FastAPI ingestion</text><text x="340" y="226" class="txt">image validation</text><text x="340" y="248" class="txt">quality + privacy checks</text><text x="340" y="270" class="sub">8 MiB · 12 MP · MIME/type</text>
<rect x="575" y="157" width="275" height="145" class="box local"/><text x="595" y="187" class="head">OpenCV 5 perception</text><text x="595" y="213" class="txt">ORB + RANSAC / ECC alignment</text><text x="595" y="235" class="txt">HSV illumination normalization</text><text x="595" y="257" class="txt">morphology · connected components</text><text x="595" y="281" class="sub">cv2 5.0.0.93 · CPU</text>
<rect x="890" y="172" width="205" height="115" class="box local"/><text x="910" y="201" class="head">Bounded agent</text><text x="910" y="226" class="txt">quality → compare</text><text x="910" y="248" class="txt">inspect → history → review</text><text x="910" y="270" class="sub">observation selects next tool</text>
<path class="arrow" d="M276 229 H315"/><path class="arrow" d="M530 229 H568"/><path class="arrow" d="M850 229 H883"/>
<rect x="320" y="348" width="270" height="118" class="box"/><text x="340" y="377" class="head">Environmental memory</text><text x="340" y="402" class="txt">camera · context · time · quality</text><text x="340" y="424" class="txt">incident frames excluded as baselines</text><text x="340" y="448" class="sub">historical retrieval changes decisions</text>
<rect x="650" y="348" width="300" height="118" class="box"/><text x="670" y="377" class="head">Auditable evidence bundle</text><text x="670" y="402" class="txt">annotated PNG · mask · JSON · HTML</text><text x="670" y="424" class="txt">SHA-256 · trace · human review record</text><text x="670" y="448" class="sub">no physical-control interface</text>
<path class="arrow" d="M700 302 V326 H455 V341"/><path class="arrow" d="M990 287 V326 H800 V341"/><path class="arrow" d="M590 407 H643"/>
<rect x="40" y="556" width="1090" height="150" class="panel planned"/><text x="66" y="586" class="label" fill="#7152c7">VERIFIED AWS SERVERLESS DEPLOYMENT · COMMIT b851290</text>
<rect x="72" y="611" width="266" height="66" class="box local"/><text x="92" y="638" class="head">Public Lambda URL</text><text x="92" y="660" class="sub">7 synthetic scenarios · uploads disabled</text>
<rect x="440" y="611" width="285" height="66" class="box local"/><text x="460" y="638" class="head">Lambda · Python 3.14 ZIP</text><text x="460" y="660" class="sub">FastAPI + OpenCV 5 · 512 MiB</text>
<rect x="825" y="611" width="267" height="66" class="box local"/><text x="845" y="638" class="head">Private S3 + CloudWatch</text><text x="845" y="660" class="sub">7-day evidence · 14-day logs</text>
<path class="arrow" d="M338 644 H432"/><path class="arrow" d="M725 644 H817"/>
<text x="72" y="696" class="sub">CodeBuild/ECR provisioned but unused; queue quota prevented builds. ZIP Lambda package is deployed.</text></svg>
