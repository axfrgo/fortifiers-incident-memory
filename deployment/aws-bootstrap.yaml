AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal build, private image registry, private synthetic-evidence store, and Lambda execution role.

Parameters:
  ImageRepositoryName:
    Type: String
    Default: fortifiers-incident-memory
    AllowedPattern: '[a-z0-9]+(?:[._-][a-z0-9]+)*'
  SourceRepository:
    Type: String
    Default: https://github.com/axfrgo/fortifiers-incident-memory.git

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-demo-evidence-after-seven-days
            Status: Enabled
            Prefix: evidence/
            ExpirationInDays: 7

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref ImageRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the latest three demo images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}'

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/fortifiers-incident-memory-lambda
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-private-demo-evidence-and-function-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${EvidenceBucket.Arn}/evidence/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/fortifiers-incident-memory-demo:*'

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: push-lambda-image-and-write-build-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/fortifiers-incident-memory-lambda:*'

  ContainerBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: fortifiers-incident-memory-lambda
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 20
      QueuedTimeoutInMinutes: 10
      ConcurrentBuildLimit: 1
      Source:
        Type: GITHUB
        Location: !Ref SourceRepository
        GitCloneDepth: 1
        BuildSpec: deployment/buildspec-lambda.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Type: PLAINTEXT
            Value: !GetAtt ImageRepository.RepositoryUri
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          StreamName: builds
        S3Logs:
          Status: DISABLED

Outputs:
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  ImageRepositoryName:
    Value: !Ref ImageRepository
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  ContainerBuildProjectName:
    Value: !Ref ContainerBuild
